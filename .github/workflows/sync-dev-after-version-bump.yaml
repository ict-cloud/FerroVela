name: "Sync dev after version bump"

# Runs on every push to master, but only does work when the push changed the
# `version` in Cargo.toml (i.e. a version bump landed on master). It then merges
# master into dev so that dev contains the bump commit again.

on:
  push:
    branches:
      - "master"

# Serialize runs so two quick bumps cannot race on the dev branch.
concurrency:
  group: sync-dev-after-version-bump
  cancel-in-progress: false

jobs:
  sync-dev:
    name: "Merge master into dev"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check whether the version changed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "Branch created by this push, nothing to compare. Skipping."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version_of() {
            git show "$1:Cargo.toml" | awk -F '"' '/^version/ {print $2; exit}'
          }
          OLD=$(version_of "$BEFORE")
          NEW=$(version_of "$AFTER")
          echo "Version: ${OLD:-<none>} -> ${NEW:-<none>}"
          if [ -n "$NEW" ] && [ "$OLD" != "$NEW" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No version change, nothing to sync."
          fi

      # dev is protected (changes must go through a PR), so build the sync on a
      # branch and open a PR instead of pushing to dev.
      - name: Build sync branch from dev + master
        id: branch
        if: steps.check.outputs.bumped == 'true'
        env:
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          if git merge-base --is-ancestor "$AFTER" origin/dev; then
            echo "dev already contains $AFTER, nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="sync/master-${NEW_VERSION}"
          git checkout -B "$BRANCH" origin/dev
          # Fails loudly on conflicts; resolve manually in that case.
          git merge --no-edit -m "chore: sync master ${NEW_VERSION} into dev" "$AFTER"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR into dev and enable auto-merge
        if: steps.branch.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create --base dev --head "$BRANCH" \
              --title "chore: sync master ${NEW_VERSION} into dev" \
              --body "Automated sync of the version bump ${NEW_VERSION} from master into dev."
          fi
          # Merges once the branch rules are satisfied (checks/approvals).
          # Needs "Allow auto-merge" enabled in the repository settings.
          gh pr merge "$BRANCH" --auto --merge \
            || echo "::warning::Could not enable auto-merge; merge the sync PR for $BRANCH manually."

      - name: Summary
        if: steps.check.outputs.bumped == 'true'
        env:
          NEEDED: ${{ steps.branch.outputs.needed }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if [ "$NEEDED" = "true" ]; then
            echo "Opened sync PR from $BRANCH into dev for master ${NEW_VERSION}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dev already contains master ${NEW_VERSION}; no PR needed." >> "$GITHUB_STEP_SUMMARY"
          fi
